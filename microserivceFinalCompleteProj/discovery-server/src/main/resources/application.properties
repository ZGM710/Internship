eureka.instance.hostname=localhost
eureka.client.register-with-eureka=false
#we dont want the server itself to register as client

eureka.client.fetch-registry=false
#becuase the server maintain the registry localy
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
server.port=8761
#environment varaible
eureka.username=${EUREKA_USERNAME:eureka}
eureka.password=${EUREKA_PASSWORD:password}



# Send traces to Zipkin
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
# add traceId/spanId to logs
logging.pattern.level=%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]