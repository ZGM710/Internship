spring.application.name=inventory-service

spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver
spring.datasource.url = jdbc:mysql://localhost:3306/inventory-service
spring.datasource.username=root
spring.datasource.password=88364670
spring.jpa.hibernate.ddl-auto=create-drop

server.port=0
#for dicovery server we changed port from 8082 to 0, in order to set one free random port in our machine as the port

eureka.client.serviceUrl.defaultZone=http://eureka:password@localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost


# Send traces to Zipkin
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
# add traceId/spanId to logs
logging.pattern.level=%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]